[package]
name = "yargui"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "A viewer for RIF files (register interface)"
repository = "https://github.com/TheClams/yargui"
readme = "Readme.md"
categories = ["hardware-support"]
keywords = ["register", "rif"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
eframe = "0.31"
egui = "0.31"
egui-file-dialog = "0.10"
egui_extras = "0.31"
yarig = "0.23"
